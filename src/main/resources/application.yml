server:
  port: ${PORT:8080}
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB
  use-forward-headers: true
  forward-headers-strategy: framework
  tomcat:
    remoteip:
      remote-ip-header: x-forwarded-for
      protocol-header: x-forwarded-proto
      internal-proxies: 10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.\168\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2[0-9]|3[0-1])\.\d{1,3}\.\d{1,3}|127\.\d{1,3}\.\d{1,3}\.\d{1,3}

mercadopago:
  access-token: ${MP_ACCESS_TOKEN:}
  api-url: https://api.mercadopago.com

spring:
  datasource:

    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/bd_tienda_alesstore?useSSL=true&allowPublicKeyRetrieval=true}
    username: ${DATABASE_USERNAME:root}
    password: ${DATABASE_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none
      format_sql: true
      #dialect: org.hibernate.dialect.MySQL8Dialect
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${correo.from}
    password: ${MAIL_PASSWORD}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

correo:
  admin: crearveint@gmail.com
  from: crearveint@gmail.com

error:
  include-message: always
  include-binding-errors: always
  include-stacktrace: on_trace_param
  include-exception: false
telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN:token_por_defecto_local}
  chat:
    id: ${TELEGRAM_CHAT_ID:id_por_defecto_local}

hashids:
  secret: ${HASHIDS_SECRET:clave_local_dev}
  min-length: 8

app:
  baseUrlCloudaflare: ${APP_BASE_URL:http://localhost:8080}

logging:
  level:
    root: WARN
    com:
      ceqb:
        SistemaVentaDispositivos2025: INFO
  file:
    name: logs/app.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
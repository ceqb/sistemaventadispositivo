<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmación de Pedido</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" th:href="@{/Adminlte/img/favicon.ico}">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen p-6">

<div class="max-w-4xl mx-auto bg-white p-8 rounded-xl shadow-lg">
  <h1 class="text-3xl font-bold text-center text-gray-900 mb-6">¡Pedido Confirmado!</h1>

  <p class="text-gray-700 text-center mb-6" th:text="${mensaje}"></p>

  <div class="bg-gray-50 p-6 rounded-lg shadow-sm mb-6 border border-gray-200">
    <h2 class="text-2xl font-semibold text-gray-900 mb-4">Datos del Pedido</h2>
    <div class="grid grid-cols-2 gap-4 text-gray-700">
      <p><strong>Número de Pedido:</strong> <span th:text="${pedido.numeroPedido}"></span></p>
      <p><strong>Fecha:</strong> <span th:text="${#temporals.format(pedido.fechaPedido, 'dd/MM/yyyy HH:mm')}"></span></p>
      <p><strong>Método de Pago:</strong> <span th:text="${pedido.metodoPago}"></span></p>
      <p><strong>Total:</strong> S/. <span th:text="${#numbers.formatDecimal(pedido.total, 0, 'COMMA', 2, 'POINT')}"></span></p>
      <p><strong>Direccion:</strong> <span th:text="${pedido.direccionEntrega}"></span></p>
    </div>
  </div>

  <div class="overflow-hidden rounded-lg shadow-sm border border-gray-200">
    <h2 class="text-2xl font-semibold text-gray-900 p-6 border-b border-gray-200">Detalle de Productos</h2>
    <table class="min-w-full divide-y divide-gray-200">
      <thead class="bg-gray-50">
      <tr>
        <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Producto</th>
        <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Cantidad</th>
        <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Precio Unitario</th>
      </tr>
      </thead>
      <tbody class="bg-white divide-y divide-gray-200">
      <tr th:each="detalle : ${pedido.detalles}" class="hover:bg-gray-50 transition-colors duration-150">
        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" th:text="${detalle.nombreProducto}"></td>
        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${detalle.cantidad}"></td>
        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">S/. <span th:text="${#numbers.formatDecimal(detalle.precioUnitario, 0, 'COMMA', 2, 'POINT')}"></span></td>
      </tr>
      </tbody>
    </table>
  </div>

  <div class="mt-6 text-center">
    <a th:href="@{/tienda}"
       class="inline-block bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-6 rounded-full shadow-sm transition-colors duration-200">
      Volver a la Tienda
    </a>
  </div>
</div>

</body>
</html>

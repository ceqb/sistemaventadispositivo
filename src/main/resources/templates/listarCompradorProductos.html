<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Gestión de Compradores</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-header { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fadeIn { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="bg-[#f8fafc]">

<div class="container mx-auto px-4 py-10 max-w-[1636px]">

    <div class="flex flex-col md:flex-row md:items-center justify-between mb-8 gap-4">
        <div>
            <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">
                Gestión de Compradores
            </h1>
            <p class="text-gray-500 mt-1">Monitorea las ventas y datos de contacto de tus clientes.</p>
        </div>
        <div class="flex items-center gap-3">
            <span class="bg-blue-100 text-blue-700 px-4 py-2 rounded-xl text-sm font-semibold shadow-sm border border-blue-200">
                Total: <span th:text="${compradores.size()}">0</span> Clientes
            </span>
            <a th:href="@{/tienda}" class="bg-gray-900 hover:bg-black text-white px-5 py-2.5 rounded-xl text-sm font-medium transition-all flex items-center gap-2 shadow-lg">
                <i class="fas fa-plus"></i> Nueva Venta
            </a>
        </div>
    </div>

    <div class="mb-6 flex flex-col md:flex-row gap-4 items-center justify-between">
        <div class="relative w-full md:w-96 group">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                <i class="fas fa-search text-gray-400 group-focus-within:text-blue-500 transition-colors"></i>
            </div>
            <input type="text" id="searchInput"
                   placeholder="Buscar por cliente, producto o dirección..."
                   class="block w-full pl-11 pr-4 py-3 bg-white border border-gray-200 rounded-2xl text-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all shadow-sm shadow-gray-100">
        </div>

        <div class="flex items-center gap-2 w-full md:w-auto">
            <button class="flex-1 md:flex-none flex items-center justify-center gap-2 px-4 py-2.5 bg-white border border-gray-200 rounded-xl text-xs font-bold text-gray-600 hover:bg-gray-50 transition-all shadow-sm">
                <i class="fas fa-filter text-blue-500"></i> Filtrar
            </button>
            <button id="exportBtn" class="flex-1 md:flex-none flex items-center justify-center gap-2 px-4 py-2.5 bg-white border border-gray-200 rounded-xl text-xs font-bold text-gray-600 hover:bg-gray-50 transition-all shadow-sm">
                <i class="fas fa-download text-green-500"></i> Exportar
            </button>
        </div>
    </div>

    <div class="bg-white rounded-3xl shadow-xl shadow-gray-200/50 border border-gray-100 overflow-hidden">

        <!-- VERSION MOVIL -->
        <div class="block lg:hidden">
            <div th:each="comp : ${compradores}" class="p-6 border-b border-gray-100 hover:bg-blue-50/30 transition-all search-item">
                <div class="flex justify-between items-start mb-4">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-blue-500 to-indigo-600 flex items-center justify-center text-white font-bold shadow-md">
                            <span th:text="${comp.nombre != null ? comp.nombre.substring(0,1).toUpperCase() : '?'}"></span>
                        </div>
                        <div>
                            <h4 class="text-gray-900 font-bold text-sm leading-none mb-1" th:text="${comp.nombre}"></h4>
                            <span class="text-gray-400 text-[10px] font-mono" th:text="${'#' + comp.id}"></span>
                        </div>
                    </div>
                    <div th:classappend="${comp.pagado ? 'bg-green-50 text-green-600 border-green-100' : 'bg-amber-50 text-amber-600 border-amber-100'}"
                         class="px-3 py-1 rounded-full text-[8px] font-bold uppercase border">
                        <i th:class="${comp.pagado ? 'fas fa-check-circle' : 'fas fa-clock'}"></i>
                        <span th:text="${comp.pagado ? 'Pagado' : 'Pendiente'}"></span>
                    </div>
                </div>

                <div class="flex items-center gap-4 mb-4 p-3 bg-gray-50/50 rounded-2xl border border-gray-100">
                    <div th:with="folder=${comp.producto?.nombre != null ? comp.producto.nombre.replaceAll('\s+', '_') : 'default'}"
                         class="w-14 h-14 rounded-xl bg-white border border-gray-100 p-1 flex-shrink-0 shadow-sm">
                        <img th:src="@{'/uploads/' + ${folder} + '/' + ${comp.producto?.foto}}"
                             class="w-full h-full object-contain" alt="IMG">
                    </div>
                    <div class="flex flex-col min-w-0">
                        <span class="text-gray-900 font-bold text-sm truncate" th:text="${comp.producto?.nombre}"></span>
                        <div class="flex items-center gap-1.5 mt-1">
                            <span class="text-blue-600 font-bold text-xs"
                                  th:text="${comp.producto?.precio != null ? 'S/. ' + #numbers.formatDecimal(comp.producto.precio, 1, 'COMMA', 2, 'POINT') : 'S/. 0.00'}"></span>
                            <span class="text-[10px] text-gray-400 font-medium italic">(Precio Unit.)</span>
                            <span class="text-[10px] text-gray-400 font-medium italic" th:text="${'x' + comp.cantidad }">x </span>
                        </div>
                    </div>
                </div>

                <div class="flex items-end justify-between">
                    <div class="space-y-1">
                        <div class="flex items-center gap-2 text-gray-500 text-xs">
                            <i class="fas fa-phone-alt text-gray-400 w-3"></i>
                            <span th:text="${comp.telefono}"></span>
                        </div>
                        <div class="flex items-center gap-2 text-gray-900 font-black text-lg">
                            <span class="text-[10px] text-gray-400 font-bold uppercase">Total:</span>
                            <span th:text="${comp.total != null ? 'S/. ' + #numbers.formatDecimal(comp.total, 1, 'COMMA', 2, 'POINT') : 'S/. 0.00'}"></span>
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <a th:href="@{/comprador/editar/{id}(id=${comp.id})}"
                           class="w-10 h-10 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center border border-blue-100">
                            <i class="fas fa-edit text-sm"></i>
                        </a>
                        <a th:href="@{/comprador/eliminar/{id}(id=${comp.id})}"
                           onclick="return confirm('¿Está seguro?')"
                           class="w-10 h-10 rounded-xl bg-red-50 text-red-500 flex items-center justify-center border border-red-100">
                            <i class="fas fa-trash-alt text-sm"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
        <!--FIN  VERSION MOVIL -->
        <div class="hidden lg:block overflow-x-auto custom-scrollbar">
            <table class="min-w-full divide-y divide-gray-100">
                <thead>
                <tr class="bg-gray-50/50">
                    <th class="py-5 px-6 text-left text-xs font-bold text-gray-400 uppercase tracking-widest">ID</th>
                    <th class="py-5 px-6 text-left text-xs font-bold text-gray-400 uppercase tracking-widest">Cliente</th>
                    <th class="py-5 px-6 text-left text-xs font-bold text-gray-400 uppercase tracking-widest">Producto Detalle</th>
                    <th class="py-5 px-6 text-left text-xs font-bold text-gray-400 uppercase tracking-widest">Celular</th>
                    <th class="py-5 px-6 text-left text-xs font-bold text-gray-400 uppercase tracking-widest">Cant.</th>
                    <th class="py-5 px-6 text-left text-xs font-bold text-gray-400 uppercase tracking-widest">Total</th>
                    <th class="py-5 px-6 text-center text-xs font-bold text-gray-400 uppercase tracking-widest">Estado</th>
                    <th class="py-5 px-6 text-center text-xs font-bold text-gray-400 uppercase tracking-widest">Acciones</th>
                </tr>
                </thead>
                <tbody class="divide-y divide-gray-50">
                <tr th:each="comp : ${compradores}" class="hover:bg-blue-50/30 transition-colors group search-item">
                    <td class="py-4 px-6"><span class="text-gray-400 font-mono text-sm" th:text="${'#' + comp.id}"></span></td>
                    <td class="py-4 px-6">
                        <div class="flex items-center gap-3">
                            <div class="w-9 h-9 rounded-full bg-gradient-to-tr from-blue-500 to-indigo-600 flex items-center justify-center text-white font-bold text-xs shadow-md">
                                <span th:text="${comp.nombre != null ? comp.nombre.substring(0,1).toUpperCase() : '?'}"></span>
                            </div>
                            <div class="flex flex-col">
                                <span class="text-gray-900 font-semibold text-sm" th:text="${comp.nombre}"></span>
                                <span class="text-gray-400 text-xs truncate max-w-[150px]" th:text="${comp.direccion}"></span>
                            </div>
                        </div>
                    </td>
                    <td class="py-4 px-6">
                        <div class="flex items-center gap-4">
                            <div th:with="folder=${comp.producto?.nombre != null ? comp.producto.nombre.replaceAll('\s+', '_') : 'default'}"
                                 class="w-12 h-12 rounded-xl bg-gray-50 border border-gray-100 p-1 flex-shrink-0 group-hover:scale-110 transition-transform">
                                <img th:src="@{'/uploads/' + ${folder} + '/' + ${comp.producto?.foto}}" class="w-full h-full object-contain" alt="IMG">
                            </div>
                            <div class="flex flex-col">
                                <span class="text-gray-800 font-bold text-sm leading-tight" th:text="${comp.producto?.nombre}"></span>
                                <span class="text-blue-600 font-bold text-[10px]"
                                      th:text="${comp.producto?.precio != null ? 'S/. ' + #numbers.formatDecimal(comp.producto.precio, 1, 'COMMA', 2, 'POINT') : 'S/. 0.00'}"></span>
                            </div>
                        </div>
                    </td>
                    <td class="py-4 px-6">
                        <span class="text-[11px] text-gray-500 bg-gray-50 border border-gray-200 px-3 py-2 rounded-lg whitespace-nowrap inline-flex items-center gap-2">
                            <i class="fas fa-phone-alt text-gray-400 text-[10px]"></i>
                            <span th:text="${comp.telefono}"></span>
                        </span>
                    </td>
                    <td class="py-4 px-6">
                        <div class="inline-flex items-center gap-2 text-gray-600 bg-gray-100 px-2.5 py-1 rounded-lg text-xs font-bold">
                            <i class="fas fa-box text-gray-400 text-[10px]"></i>
                            <span th:text="${comp.cantidad}"></span>
                        </div>
                    </td>
                    <td class="py-4 px-6">
                        <div class="px-3 py-2 gap-2 text-gray-900 font-extrabold text-[11px] whitespace-nowrap inline-flex items-center"
                             th:text="${comp.total != null ? 'S/. ' + #numbers.formatDecimal(comp.total, 1, 'COMMA', 2, 'POINT') : 'S/. 0.00'}">
                        </div>
                    </td>
                    <td class="py-4 px-6 text-center">
                        <div th:classappend="${comp.pagado ? 'bg-green-50 text-green-600 border-green-100' : 'bg-amber-50 text-amber-600 border-amber-100'}"
                             class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[10px] font-bold uppercase border">
                            <i th:class="${comp.pagado ? 'fas fa-check-circle' : 'fas fa-clock'}"></i>
                            <span th:text="${comp.pagado ? 'Pagado' : 'Pendiente'}"></span>
                        </div>
                    </td>
                    <td class="py-4 px-6 text-center">
                        <div class="flex justify-center gap-2">
                            <a th:href="@{/comprador/editar/{id}(id=${comp.id})}" class="w-8 h-8 rounded-lg border flex items-center justify-center text-blue-600 hover:bg-blue-600 hover:text-white transition-all shadow-sm"><i class="fas fa-edit text-[10px]"></i></a>
                            <a th:href="@{/comprador/eliminar/{id}(id=${comp.id})}" onclick="return confirm('¿Está seguro?')" class="w-8 h-8 rounded-lg border flex items-center justify-center text-red-500 hover:bg-red-500 hover:text-white transition-all shadow-sm"><i class="fas fa-trash-alt text-[10px]"></i></a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="bg-gray-50/50 px-6 py-4 border-t border-gray-100 flex justify-between items-center">
            <span class="text-xs text-gray-400 font-medium italic">Mostrando compras registradas en el sistema de Alesstore</span>
            <div class="flex gap-1">
                <div class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></div>
                <div class="w-2 h-2 rounded-full bg-blue-400 animate-pulse" style="animation-delay: 0.2s"></div>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/js/admin/CompradoresProductos/exportar.js}"></script>

<script>
    document.getElementById('searchInput').addEventListener('keyup', function() {
        const value = this.value.toLowerCase();
        const items = document.querySelectorAll('.search-item');

        items.forEach(item => {
            const texto = item.innerText.toLowerCase();
            if (texto.includes(value)) {
                item.style.display = "";
                item.classList.add('fadeIn');
            } else {
                item.style.display = "none";
            }
        });
    });
</script>

</body>
</html>

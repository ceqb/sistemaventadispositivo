<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pedidos Retrasados</title>

    <!-- AdminLTE + Tailwind opcional -->
    <link rel="stylesheet" th:href="@{/dist/css/adminlte.min.css}">
    <link rel="icon" type="image/x-icon" th:href="@{/Adminlte/img/favicon.ico}">
    <script th:src="@{/plugins/fontawesome-free/js/all.min.js}"></script>

    <style>
        .retrasado {
            background-color: #ffe5e5 !important;
        }
    </style>
</head>

<body class="hold-transition sidebar-mini layout-fixed">
<div class="wrapper">

    <!-- Navbar -->
    <nav th:replace="fragments/navbar :: navbar"></nav>

    <!-- Sidebar -->
    <aside th:replace="fragments/sidebar :: sidebar"></aside>

    <!-- Contenido Principal -->
    <div class="content-wrapper">

        <!-- Encabezado -->
        <section class="content-header">
            <div class="container-fluid">
                <h1 class="text-danger">
                    <i class="fas fa-clock"></i> Pedidos Retrasados
                </h1>
                <p class="text-muted">
                    Pedidos asignados que superan el tiempo permitido sin entregarse.
                </p>
            </div>
        </section>

        <!-- Contenido -->
        <section class="content">
            <div class="container-fluid">

                <!-- Tarjeta -->
                <div class="card shadow-sm">

                    <div class="card-header bg-danger text-white">
                        <h3 class="card-title">
                            <i class="fas fa-exclamation-triangle"></i>
                            Total retrasados:
                            <span class="badge badge-light" th:text="${retrasadosCount}"></span>
                        </h3>
                    </div>

                    <div class="card-body">

                        <!-- Si NO hay pedidos -->
                        <div th:if="${pedidosRetrasados.size() == 0}" class="alert alert-success text-center">
                            <i class="fas fa-check-circle"></i> No hay pedidos retrasados 🎉
                        </div>

                        <!-- Tabla -->
                        <div th:if="${pedidosRetrasados.size() > 0}" class="table-responsive">
                            <table class="table table-bordered table-hover">
                                <thead class="bg-light">
                                <tr>
                                    <th># Pedido</th>
                                    <th>Cliente</th>
                                    <th>Repartidor</th>
                                    <th>Fecha Pedido</th>
                                    <th>Fecha Asignación</th>
                                    <th>Días de Retraso</th>
                                    <th>Total</th>
                                    <th>Acciones</th>
                                </tr>
                                </thead>

                                <tbody>
                                <tr th:each="p : ${pedidosRetrasados}" class="retrasado">

                                    <td th:text="${p.numeroPedido}"></td>

                                    <td>
                                        <span th:text="${p.usuarioNombre}"></span><br>
                                        <small class="text-muted">ID: <span th:text="${p.usuarioId}"></span></small>
                                    </td>

                                    <td>
                                        <span th:text="${p.repartidorNombre != null ? p.repartidorNombre : 'Sin asignar'}"></span>
                                    </td>

                                    <td th:text="${#temporals.format(p.fechaPedido, 'yyyy-MM-dd HH:mm')}"></td>

                                    <td th:text="${#temporals.format(p.fechaAsignacion, 'yyyy-MM-dd HH:mm')}"></td>

                                    <!-- Días de retraso -->
                                    <td>
                                        <span class="badge badge-danger p-2"
                                              th:text="${T(java.time.Duration).between(p.fechaAsignacion, T(java.time.LocalDateTime).now()).toDays()} + ' días'">
                                        </span>
                                    </td>

                                    <td>S/ <span th:text="${p.total}"></span></td>

                                    <td>
                                        <a class="btn btn-primary btn-sm"
                                           th:href="@{'/admin/pedidos/detalle/' + ${p.id}}">
                                            <i class="fas fa-eye"></i> Ver
                                        </a>
                                    </td>

                                </tr>
                                </tbody>
                            </table>
                        </div>

                    </div> <!-- card-body -->

                </div> <!-- card -->

            </div>
        </section>

    </div> <!-- content-wrapper -->

</div>

<script th:src="@{/dist/js/adminlte.min.js}"></script>

</body>
</html>

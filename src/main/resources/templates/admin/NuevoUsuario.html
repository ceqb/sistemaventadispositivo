    <form th:action="@{/registrar}" th:object="${usuarioDTO}" method="post" class="space-y-4">

        <div class="relative">
            <i class="fas fa-user absolute left-3 top-3 text-gray-400"></i>
            <input type="text" th:field="*{usuario}" placeholder="Usuario"
                   class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" required>
            <small th:if="${#fields.hasErrors('usuario')}"
                   th:errors="*{usuario}" class="error"></small>
        </div>

        <div class="relative">
            <i class="fas fa-signature absolute left-3 top-3 text-gray-400"></i>
            <input type="text" th:field="*{nombre}" placeholder="Nombre completo"
                   class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" required>
            <small th:if="${#fields.hasErrors('nombre')}"
                   th:errors="*{nombre}" class="error"></small>
        </div>

        <div class="relative">
            <i class="fas fa-envelope absolute left-3 top-3 text-gray-400"></i>
            <input type="email" th:field="*{correo}" placeholder="Correo electrónico"
                   class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" required>
            <small th:if="${#fields.hasErrors('correo')}"
                   th:errors="*{correo}" class="error"></small>
        </div>

        <div class="relative">
            <i class="fas fa-key absolute left-3 top-3 text-gray-400"></i>
            <input type="password" th:field="*{clave}" placeholder="Contraseña"
                   class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" required>
            <small th:if="${#fields.hasErrors('clave')}"
                   th:errors="*{clave}" class="error"></small>
        </div>

        <div class="relative">
            <i class="fas fa-lock absolute left-3 top-3 text-gray-400"></i>
            <input type="password" name="confirmarClave" placeholder="Confirmar contraseña"
                   class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" required>
        </div>

        <div th:if="${errorRegistro}" class="error" th:text="${errorRegistro}"></div>

        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg shadow transition-all duration-200"><i class="fas fa-user-plus mr-2"></i>Registrar</button>
    </form>

    <p class="text-center text-sm text-gray-600 mt-6">
        ¿Ya tienes una cuenta?
        <a th:href="@{/login}" class="text-blue-600 hover:underline font-semibold">
            Inicia sesión aquí
        </a>
    </p>
</div>
</body>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Premium Login | Sistema de Ventas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/a2e0c0a36e.js" crossorigin="anonymous"></script>

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at top left, #1e3a8a, #0f172a);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .input-group:focus-within i {
            color: #2563eb;
            transform: scale(1.1);
        }
        .animate-fade-in {
            animation: fadeIn 0.5s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body class="flex items-center justify-center min-h-screen p-4 overflow-hidden">

<div class="hidden md:block absolute top-0 left-0 w-64 h-64 bg-blue-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob"></div>
<div class="hidden md:block absolute bottom-0 right-0 w-80 h-80 bg-purple-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob animation-delay-2000"></div>

<div class="w-full max-w-md z-10 animate-fade-in">

    <div th:if="${registroExitoso}" class="mb-4 p-4 bg-green-100 border-l-4 border-green-500 text-green-700 rounded shadow-md flex items-center gap-3">
        <i class="fas fa-check-circle"></i>
        <span th:text="${registroExitoso}" class="text-sm font-medium"></span>
    </div>

    <div th:if="${loginError}" class="mb-4 p-4 bg-red-100 border-l-4 border-red-500 text-red-700 rounded shadow-md flex items-center gap-3">
        <i class="fas fa-exclamation-circle"></i>
        <span th:text="${loginError}" class="text-sm font-medium"></span>
    </div>

    <div class="glass-card p-8 md:p-10 rounded-3xl shadow-2xl">
        <div class="text-center mb-10">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-600 rounded-2xl shadow-lg mb-4 transform -rotate-6">
                <i class="fas fa-shield-alt text-white text-3xl"></i>
            </div>
            <h2 class="text-3xl font-extrabold text-gray-800 tracking-tight">Bienvenido</h2>
            <p class="text-gray-500 text-sm mt-2">Ingresa tus credenciales para continuar</p>
        </div>

        <form th:action="@{/login}" method="post" class="space-y-5">

            <div class="input-group relative group">
                <label for="nombre" class="text-xs font-semibold text-gray-600 uppercase ml-1 mb-1 block">Usuario</label>
                <div class="relative">
                    <i class="fas fa-user absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 transition-all duration-300"></i>
                    <input type="text" id="nombre" name="nombre" required
                           class="w-full pl-12 pr-4 py-3.5 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all placeholder-gray-400"
                           placeholder="ej. JuanPerez88">
                </div>
            </div>

            <div class="input-group relative group">
                <label for="clave" class="text-xs font-semibold text-gray-600 uppercase ml-1 mb-1 block">Contraseña</label>
                <div class="relative">
                    <i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 transition-all duration-300"></i>
                    <input type="password" id="clave" name="clave" required
                           class="w-full pl-12 pr-4 py-3.5 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all placeholder-gray-400"
                           placeholder="••••••••">
                </div>
            </div>

            <div class="flex items-center justify-between px-1">
                <label class="flex items-center group cursor-pointer">
                    <input type="checkbox" name="rememberMe" value="true"
                           class="w-4 h-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500 transition-all">
                    <span class="ml-2 text-sm text-gray-600 group-hover:text-blue-600 transition-colors">Recordarme</span>
                </label>
                <a th:href="@{/password/forgot}" class="text-sm font-medium text-blue-600 hover:text-blue-700 hover:underline transition-colors">
                    ¿Olvidaste tu clave?
                </a>
            </div>

            <button type="submit"
                    class="w-full py-4 bg-blue-600 text-white rounded-xl font-bold shadow-lg shadow-blue-200 hover:bg-blue-700 hover:shadow-blue-300 active:scale-95 transition-all flex items-center justify-center gap-3 group">
                <span>ACCEDER</span>
                <i class="fas fa-arrow-right group-hover:translate-x-1 transition-transform"></i>
            </button>
        </form>

        <div class="mt-10 pt-6 border-t border-gray-100 text-center">
            <p class="text-gray-600 text-sm">
                ¿No tienes una cuenta?
                <a th:href="@{/registrar}" class="text-blue-600 font-bold hover:text-blue-800 transition-colors underline-offset-4 hover:underline">
                    Regístrate ahora
                </a>
            </p>
        </div>
    </div>

    <p th:if="${error}" th:text="${error}" class="mt-4 text-center text-white bg-red-500/80 backdrop-blur-sm p-2 rounded-lg text-xs animate-pulse"></p>
</div>

</body>
</html>

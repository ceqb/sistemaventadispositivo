<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Recuperar Contraseña</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/a2e0c0a36e.js" crossorigin="anonymous"></script>
    <style> body { font-family: 'Roboto', sans-serif; } </style>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
<div class="bg-white p-8 md:p-12 rounded-xl shadow-2xl w-full max-w-sm mx-auto">

    <h2 class="text-2xl font-bold text-gray-800 text-center mb-6">
        <i class="fas fa-envelope text-xl mr-2"></i> Restablecer Contraseña
    </h2>

    <p th:if="${mensaje}" th:text="${mensaje}" class="mt-4 text-center text-green-600 font-medium"></p>
    <p th:if="${error}" th:text="${error}" class="mt-4 text-center text-red-500 font-medium"></p>

    <p class="text-gray-600 mb-6 text-center text-sm">
        Ingresa tu correo electrónico y te enviaremos un enlace para restablecer tu contraseña.
    </p>

    <form th:action="@{/password/forgot}" method="post" class="space-y-4">
        <div class="relative">
            <i class="fas fa-at absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
            <input type="email" id="correo" name="correo" placeholder="Correo Electrónico" required
                   class="w-full pl-12 pr-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-colors">
        </div>

        <button type="submit"
                class="w-full py-3 px-6 bg-blue-600 text-white rounded-lg font-semibold hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-transform transform hover:scale-105">
            Enviar Enlace
        </button>
    </form>

    <p class="mt-6 text-center text-gray-600 text-sm">
        <a th:href="@{/login}" class="text-blue-600 font-semibold hover:underline">
            Volver al inicio de sesión
        </a>
    </p>
</div>
</body>
</html>

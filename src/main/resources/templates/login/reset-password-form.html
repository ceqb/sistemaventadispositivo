<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Restablecer Contraseña</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/a2e0c0a36e.js" crossorigin="anonymous"></script>

    <style>
        body {
            font-family: 'Roboto', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

<div class="bg-white p-8 md:p-12 rounded-xl shadow-2xl w-full max-w-sm mx-auto">
    <h2 class="text-3xl font-bold text-gray-800 text-center mb-6 flex items-center justify-center gap-2">
        <i class="fas fa-key text-xl"></i> Nueva Contraseña
    </h2>

    <p class="text-gray-600 mb-6 text-center text-sm">
        Ingresa tu nueva contraseña. Debe ser segura y la recordarás.
    </p>

    <form th:action="@{/password/reset}" method="post" class="space-y-6" id="resetForm">

        <input type="hidden" name="token" th:value="${token}" required>

        <div class="relative">
            <i class="fas fa-lock absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
            <input type="password" id="password" name="password" placeholder="Nueva Contraseña" required
                   class="w-full pl-12 pr-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-colors">
        </div>

        <div class="relative">
            <i class="fas fa-check-double absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirmar Contraseña" required
                   class="w-full pl-12 pr-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-colors">
        </div>

        <p id="passwordError" class="text-center text-sm font-medium text-red-500 hidden"></p>

        <button type="submit"
                class="w-full py-3 px-6 bg-blue-600 text-white rounded-lg font-semibold hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-transform transform hover:scale-105 flex items-center justify-center gap-2">
            <i class="fas fa-sync-alt"></i> Cambiar Contraseña
        </button>
    </form>

    <p class="mt-6 text-center text-gray-600 text-sm">
        <a th:href="@{/login}" class="text-blue-600 font-semibold hover:underline">
            Volver al inicio de sesión
        </a>
    </p>
</div>

<script>
    document.getElementById('resetForm').addEventListener('submit', function(event) {
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const errorElement = document.getElementById('passwordError');

        if (password !== confirmPassword) {
            errorElement.textContent = 'Las contraseñas no coinciden. Por favor, revísalas.';
            errorElement.classList.remove('hidden');
            event.preventDefault(); // Detiene el envío del formulario
        } else {
            errorElement.classList.add('hidden');
        }
    });
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Error 500 - Error Interno</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 550px;
            margin: 90px auto;
            background: white;
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0px 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            font-size: 42px;
            color: #dc3545;
            margin-bottom: 10px;
        }

        p {
            font-size: 18px;
            margin-top: 0;
            color: #555;
        }

        .btn-volver {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background: #007bff;
            color: white;
            border-radius: 8px;
            text-decoration: none;
            font-size: 16px;
        }

        .btn-volver:hover {
            background: #0056b3;
        }
    </style>

</head>

<body>

<div class="container">
    <h1>Error 500</h1>
    <p>Ha ocurrido un error inesperado en el sistema.</p>
    <p>Estamos trabajando para solucionarlo.</p>

    <a th:href="@{/admin/index}" class="btn-volver">Volver al inicio</a>
</div>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle Pedido</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* Fondo gris claro */
        }
    </style>
</head>
<body>
<div class="container mx-auto max-w-4xl mt-8 p-4 sm:p-6">

    <h1 class="text-3xl font-extrabold text-gray-800 mb-6 flex items-center">
        <span class="mr-3 text-indigo-600">📄</span> Detalle Pedido #<span th:text="${pedido.numeroPedido}"></span>
    </h1>

    <div class="bg-white shadow-lg rounded-xl p-6 mb-8 border border-gray-200">
        <h2 class="text-xl font-bold text-gray-700 mb-4 border-b pb-2">Información General</h2>

        <div class="space-y-2 text-gray-600">
            <p><b class="font-semibold text-gray-900">Cliente:</b> <span th:text="${pedido.usuarioNombre}"></span></p>
            <p>
                <b class="font-semibold text-gray-900">Estado:</b>
                <span th:text="${pedido.estadoPedido}"
                      th:classappend="${pedido.estadoPedido == 'ASIGNADO' ? 'bg-yellow-100 text-yellow-800' :
                                       (pedido.estadoPedido == 'EN REPARTO' ? 'bg-blue-100 text-blue-800' :
                                        (pedido.estadoPedido == 'ENTREGADO_PAGADO' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'))}"
                      class="px-3 py-1 inline-flex text-sm leading-5 font-bold rounded-full">
                </span>
            </p>
            <!-- Badge pendiente aprobación de pago -->
            <div th:if="${pedido.metodoPago == 'CONTRAENTREGA'
             and pedido.estadoPedido.name() == 'ENTREGADO'
             and pedido.estadoPago.name() == 'PENDIENTE'}"
                 class="mt-2 inline-flex items-center px-3 py-1 rounded-full
            bg-orange-100 text-orange-800 text-sm font-bold">

                <i class="fas fa-clock mr-2"></i>
                Pendiente aprobación de pago (Administrador)
            </div>
            <p><b class="font-semibold text-gray-900">Método de Pago:</b> <span th:text="${pedido.metodoPago}"></span></p>
        </div>
    </div>

    <h3 class="text-2xl font-bold text-gray-800 mb-4 flex items-center">🛒 Productos</h3>
    <div class="overflow-x-auto shadow-lg rounded-xl mb-8">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
            <tr>
                <th scope="col" class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Producto</th>
                <th scope="col" class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Cantidad</th>
                <th scope="col" class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Subtotal (S/.)</th>
            </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-200">
            <tr th:each="item : ${pedido.detalles}">
                <td th:text="${item.nombreProducto}" class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900"></td>
                <td th:text="${item.cantidad}" class="px-6 py-4 whitespace-nowrap text-sm text-gray-600"></td>
                <td th:text="${item.subtotal}" class="px-6 py-4 whitespace-nowrap text-sm text-gray-600 font-semibold"></td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="bg-white shadow-xl rounded-xl p-6 flex justify-between items-center flex-wrap gap-4">
        <h3 class="text-3xl font-extrabold text-gray-900">
            Total: S/. <span th:text="${pedido.total}" class="text-green-600"></span>
        </h3>

        <div class="flex flex-col sm:flex-row space-y-2 sm:space-y-0 sm:space-x-3 w-full sm:w-auto">

            <form th:if="${pedido.estadoPedido.name() != 'EN_CAMINO'
              and pedido.estadoPedido.name() != 'ENTREGADO'
              and pedido.estadoPedido.name() != 'CANCELADO'
              and pedido.estadoPedido.name() != 'ABANDONADO'}"
                  th:action="@{/pedidosRepartidor/{numero}/avanzarEstadoPedidoRepartidor(numero=${pedido.numeroPedido})}"
                  method="post"
                  class="w-full sm:w-auto">

                <button type="submit"
                        class="w-full px-4 py-2 bg-indigo-500 text-white font-semibold rounded-lg shadow
                   hover:bg-indigo-600 transition-colors duration-200 flex items-center justify-center">
                    <i class="fas fa-arrow-right mr-2"></i> Avanzar Estado
                </button>
            </form>
            <div th:if="${usuarioLogueado != null and usuarioLogueado.nombreCargo == 'Repartidor'}">

                <!-- Botón QR (Solo si está en camino) -->
                <button th:if="${pedido.estadoPedido.name() == 'EN_CAMINO'}"
                        onclick="abrirScannerQR()"
                        class="w-full md:w-48 px-6 py-3 bg-blue-600 text-white font-bold rounded-xl shadow-lg hover:bg-blue-700 transition flex items-center justify-center">
                    <i class="fas fa-qrcode mr-2 text-xl"></i> ESCANEAR QR
                </button>
            </div>
            <form th:if="${pedido.metodoPago == 'CONTRAENTREGA' and pedido.estadoPedido != 'ENTREGADO'}"
                  th:action="@{/pedidosRepartidor/{numero}/entregadoPagado(numero=${pedido.numeroPedido})}"
                  method="post" class="w-full sm:w-auto">
                <button type="submit" class="w-full px-4 py-2 bg-green-500 text-white font-semibold rounded-lg shadow hover:bg-green-600 transition-colors duration-200 flex items-center justify-center">
                    <i class="fas fa-check-circle mr-2"></i> Confirmar Entrega + Pago
                </button>
            </form>
            <!--
            <form th:action="@{/pedidosAdmin/{id}/cancelar(id=${pedido.id})}"
                  method="post" class="w-full sm:w-auto">
                <button type="submit" class="w-full px-4 py-2 bg-red-500 text-white font-semibold rounded-lg shadow hover:bg-red-600 transition-colors duration-200 flex items-center justify-center">
                    <i class="fas fa-times-circle mr-2"></i> Cancelar Pedido
                </button>
            </form>
            -->
        </div>
    </div>

    <div class="mt-8">
        <a th:href="@{/pedidosRepartidor/pedidos}"
           class="inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-lg text-gray-700 bg-white hover:bg-gray-50 transition-colors duration-200">
            <i class="fas fa-arrow-left mr-2"></i> Volver a Mis Pedidos
        </a>
    </div>

</div>
<div id="qrModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-50">
    <div class="bg-white rounded-xl p-4 w-80 relative">
        <h3 class="text-lg font-bold text-center mb-3">Escanear QR del Cliente</h3>

        <video id="qr-video" class="w-full rounded"></video>

        <button onclick="cerrarScannerQR()"
                class="mt-3 w-full bg-gray-600 text-white py-2 rounded">
            Cancelar
        </button>
    </div>
</div>
<script src="https://unpkg.com/qr-scanner/qr-scanner.umd.min.js"></script>
<script>
    let qrScanner;
    const videoElem = document.getElementById('qr-video');

    /**
     * Abre el modal y arranca la cámara para escanear
     */
    function abrirScannerQR() {
        const modal = document.getElementById('qrModal');
        modal.classList.remove('hidden');
        modal.classList.add('flex');

        qrScanner = new QrScanner(videoElem, result => {
            console.log('QR Detectado (Crudo):', result.data);

            // Detenemos el scanner inmediatamente al detectar algo
            qrScanner.stop();
            cerrarScannerQR();

            // Procesamos la cadena recibida
            procesarToken(result.data);
        }, {
            highlightScanRegion: true,
            highlightCodeOutline: true,
        });

        qrScanner.start().catch(err => {
            console.error("Error al iniciar cámara:", err);
            alert("No se pudo acceder a la cámara. Por favor, verifica los permisos.");
            cerrarScannerQR();
        });
    }

    /**
     * Oculta el modal y detiene la cámara
     */
    function cerrarScannerQR() {
        const modal = document.getElementById('qrModal');
        modal.classList.add('hidden');
        modal.classList.remove('flex');
        if (qrScanner) qrScanner.stop();
    }

    /**
     * Extrae el token limpio de formatos JSON, Arrays o URLs
     */
    function procesarToken(data) {
    let tokenLimpio = data;

    try {
        // 1. Intentamos parsear por si el QR todavía tiene formato antiguo JSON/Array
        const objetoSocio = JSON.parse(data);
        if (Array.isArray(objetoSocio) && objetoSocio.length > 0) {
            tokenLimpio = objetoSocio[0].token || data;
        } else if (objetoSocio && objetoSocio.token) {
            tokenLimpio = objetoSocio.token;
        }
    } catch (e) {
        // Si no es JSON, se asume que es el token puro (el cambio que hicimos en PedidoClienteController)
        tokenLimpio = data;
    }

    // 2. Limpieza extrema: Solo caracteres alfanuméricos
    // Esto elimina comillas, llaves o espacios que el OCR del scanner pueda haber metido
    tokenLimpio = tokenLimpio.toString().replace(/[^a-zA-Z0-9]/g, '').trim();

    console.log('Token final a enviar:', tokenLimpio);
    confirmarEntregaEnServidor(tokenLimpio);
}

    /**
     * Realiza la petición POST al backend
     */
    function confirmarEntregaEnServidor(token) {
    // IMPORTANTE: El backend ahora espera un JSON con la propiedad "token"
    console.log("JSON enviado:", { qrToken: token });
    fetch('/pedidosRepartidor/confirmar-entrega', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({ qrToken: token })
    })
    .then(async res => {
        const respuestaTexto = await res.text();
        if (res.ok) {
            alert('✅ Entrega confirmada con éxito.');
            window.location.reload();
        } else {
            alert('❌ Error: ' + respuestaTexto);
        }
    })
    .catch(err => {
        console.error('Error de red:', err);
        alert('Error de conexión.');
    });
}
</script>
</body>
</html>
